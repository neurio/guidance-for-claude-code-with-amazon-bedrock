AWSTemplateFormatVersion: '2010-09-09'
Description: 'Claude Code quota monitoring stack for per-user token limits and alerts with fine-grained policy support'

Parameters:
  MonthlyTokenLimit:
    Type: Number
    Default: 10000000
    Description: >-
      Default monthly token limit per user (10M tokens) - used when no policy
      is defined. 0 disables token-denominated limits (cost-based quota mode).
    MinValue: 0
    MaxValue: 1000000000

  WarningThreshold80:
    Type: Number
    Default: 8000000
    Description: Default warning threshold at 80% (8M tokens) - used when no policy is defined

  WarningThreshold90:
    Type: Number
    Default: 9000000
    Description: Default warning threshold at 90% (9M tokens) - used when no policy is defined

  DailyTokenLimit:
    Type: Number
    Default: 366667
    Description: Default daily token limit per user (monthly/30 * 1.1) - 0 to disable daily limits
    MinValue: 0
    MaxValue: 100000000

  DailyEnforcementMode:
    Type: String
    Default: 'alert'
    AllowedValues:
      - 'alert'
      - 'block'
    Description: Enforcement mode for daily limits - alert (warn only) or block (deny access)

  MonthlyEnforcementMode:
    Type: String
    Default: 'block'
    AllowedValues:
      - 'alert'
      - 'block'
    Description: Enforcement mode for monthly limits - alert (warn only) or block (deny access)

  EnableFinegrainedQuotas:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable fine-grained quota policies (user/group/default levels)

  EnableBypassDetection:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Detect users invoking Bedrock without a running OTEL sidecar by joining
      CloudTrail Bedrock activity against OTEL-reported usage. Reports via
      CloudWatch metrics and SNS alerts (detective control, does not block).
      Opt-in compliance/audit feature; applies to sidecar monitoring mode.

  BypassDetectionLookbackMinutes:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 60
    Description: Lookback window (minutes) for bypass detection - should match the detection schedule

  QuotaMode:
    Type: String
    Default: 'token'
    AllowedValues:
      - 'token'
      - 'cost'
    Description: >-
      Quota enforcement mode. 'token' counts raw tokens (existing behavior).
      'cost' converts tokens to estimated USD using Bedrock pricing rates and
      compares against dollar-denominated limits.

  MonthlyCostLimitUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Monthly cost limit per user in USD (cost mode only). 0 = no limit.
      Example: 500 = block at $500/month estimated spend.

  DailyCostLimitUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Daily cost limit per user in USD (cost mode only). 0 = no limit.
      Example: 50 = block at $50/day estimated spend.

  # JWT Authentication Parameters for Quota Check API
  OidcIssuerUrl:
    Type: String
    Default: ''
    Description: OIDC provider issuer URL for JWT validation (e.g., https://company.okta.com) - leave empty to disable JWT auth

  OidcClientId:
    Type: String
    Default: ''
    Description: OIDC client ID (audience) for JWT validation

  # TimescaleDB telemetry database - authoritative per-user Bedrock cost source.
  # String / CommaDelimitedList are used deliberately instead of the
  # AWS::EC2::VPC::Id and List<AWS::EC2::Subnet::Id> types, because those
  # AWS-specific types reject an empty default and would break stack updates for
  # deployments that do not have a telemetry database.
  TelemetryDbHost:
    Type: String
    Default: ''
    Description: >-
      Private IP or DNS name of the TimescaleDB instance holding per-user
      Bedrock cost. Leave empty to disable the telemetry cost source (the quota
      monitor then has no cost source and only checks existing DynamoDB totals).
      Prefer a STABLE address - if the instance is in an Auto Scaling group its
      primary private IP changes on replacement.

  TelemetryDbPort:
    Type: Number
    Default: 5432
    MinValue: 1
    MaxValue: 65535
    Description: TimescaleDB port

  TelemetryDbName:
    Type: String
    Default: 'claude_telemetry'
    Description: TimescaleDB database name

  TelemetryDbSecretArn:
    Type: String
    Default: ''
    Description: >-
      Full ARN of the Secrets Manager secret holding the TimescaleDB
      credentials (JSON with at least `username` and `password`). Must be the
      complete ARN including the random suffix. Setting this enables the
      telemetry cost source and attaches the quota monitor to the VPC.

  TelemetryDbSslMode:
    Type: String
    Default: 'disable'
    AllowedValues:
      - 'disable'
      - 'require'
      - 'verify-full'
    Description: >-
      TLS mode for the TimescaleDB connection. 'disable' = plaintext (required
      if the server has ssl=off). 'require' = encrypted but the server
      certificate is NOT verified (confidentiality only, not MITM-resistant).
      'verify-full' = verified, and needs TelemetryDbCaPem.

  TelemetryDbCaPem:
    Type: String
    Default: ''
    Description: >-
      Path to a CA bundle vendored in the Lambda package, used only when
      TelemetryDbSslMode is 'verify-full' (e.g. /var/task/rds-ca.pem).

  TelemetryDbVpcId:
    Type: String
    Default: ''
    Description: VPC ID of the TimescaleDB instance - required when TelemetryDbSecretArn is set

  TelemetryDbEgressCidr:
    Type: String
    Default: ''
    Description: >-
      CIDR the quota monitor is allowed to reach on TelemetryDbPort. Leave empty
      to derive it as TelemetryDbHost/32, which only works when TelemetryDbHost
      is an IP address - set this explicitly if TelemetryDbHost is a DNS name.

  TelemetryDbSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Private subnet IDs (comma-separated) for the quota monitor's VPC
      attachment. Must have a route to the database and NAT egress for the
      DynamoDB/SNS/Secrets Manager API calls.

  QuotaWriteMode:
    Type: String
    Default: 'shadow'
    AllowedValues:
      - 'shadow'
      - 'enforce'
    Description: >-
      'shadow' = read the telemetry DB and log what would change, but leave
      quota counters FROZEN (only `last_updated` is refreshed, so bypass
      detection keeps working). 'enforce' = write absolute month-to-date
      totals. Deploy in shadow first, compare, then switch to enforce.

  QuotaDbMinRowRatio:
    Type: Number
    Default: 0.5
    MinValue: 0
    MaxValue: 1
    Description: >-
      Safety floor for absolute writes. If the telemetry DB returns fewer
      identities than this fraction of the existing DynamoDB rows, the monitor
      refuses to write and alerts instead of zeroing real usage.

  # Slack DM notifier for spend-budget alerts. An empty secret ARN disables the
  # feature outright (no role, no function, no subscription) — same "empty
  # string disables" idiom as TelemetryDbSecretArn above.
  SlackBotTokenSecretArn:
    Type: String
    Default: ''
    Description: >-
      Full ARN of the Secrets Manager secret holding the Slack bot token,
      including the random suffix. The secret may be either a bare token string
      or a JSON object with the token under bot_token / token / slack_bot_token.
      Required bot scopes: users:read, users:read.email, chat:write. Leave empty
      to disable Slack DM notifications entirely.

  SlackDmAllowlist:
    Type: String
    Default: 'Cameron.Johnson@generac.com'
    Description: >-
      Comma-separated recipient emails allowed to receive a Slack DM. Compared
      case-insensitively, since quota alerts carry the original OIDC email
      casing. Any other recipient is logged and skipped without a Slack API
      call. An EMPTY list blocks everyone — it does not mean "allow all".

  SlackApiTimeoutSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 20
    Description: Per-request timeout for slack.com API calls

  SlackDmHelpUrl:
    Type: String
    Default: ''
    Description: >-
      Optional link included in the DM for requesting a budget increase
      (runbook, ticket form). Leave empty to omit the line.

Conditions:
  HasJwtAuth: !Not [!Equals [!Ref OidcIssuerUrl, '']]
  NoJwtAuth: !Equals [!Ref OidcIssuerUrl, '']
  BypassDetectionEnabled: !Equals [!Ref EnableBypassDetection, 'true']
  HasTelemetryDb: !Not [!Equals [!Ref TelemetryDbSecretArn, '']]
  HasTelemetryDbEgressCidr: !Not [!Equals [!Ref TelemetryDbEgressCidr, '']]
  SlackNotifierEnabled: !Not [!Equals [!Ref SlackBotTokenSecretArn, '']]

Resources:
  # DynamoDB table for quota policies (user, group, default levels)
  QuotaPolicies:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: QuotaPolicies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: policy_type
          AttributeType: S
        - AttributeName: identifier
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: PolicyTypeIndex
          KeySchema:
            - AttributeName: policy_type
              KeyType: HASH
            - AttributeName: identifier
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # Opt-in per item: DynamoDB only deletes items that carry a numeric `ttl`
      # (epoch SECONDS). Policies without the attribute -- default, group, and
      # ordinary user policies -- are never touched. Only `quota set-user
      # --expires-month-end` stamps it, for temporary single-month overrides.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: QuotaPolicies
        - Key: Purpose
          Value: Fine-grained quota policy definitions

  # DynamoDB table for user quota tracking
  UserQuotaMetrics:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserQuotaMetrics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: UserQuotaMetrics
        - Key: Purpose
          Value: User quota monitoring and alerts

  # SNS Topic for quota alerts
  QuotaAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: claude-code-quota-alerts
      DisplayName: Claude Code Quota Alerts
      Tags:
        - Key: Name
          Value: ClaudeCodeQuotaAlerts
        - Key: Purpose
          Value: Quota monitoring notifications

  # IAM Role for Quota Monitor Lambda
  QuotaMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # AWSLambdaVPCAccessExecutionRole grants the ec2 Describe*/CreateNetworkInterface
      # /DeleteNetworkInterface permissions Lambda needs to manage its ENI. It is only
      # attached when the function is actually VPC-attached.
      ManagedPolicyArns: !If
        - HasTelemetryDb
        - - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
          - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
        - - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: QuotaMonitorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UserQuotaMetrics.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt QuotaPolicies.Arn
                  - !Sub '${QuotaPolicies.Arn}/index/*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref QuotaAlertTopic
              # Read the TimescaleDB credentials. Scoped to the single secret
              # ARN; an IAM Resource cannot be an empty string, so a harmless
              # placeholder ARN is used when no telemetry DB is configured.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !If
                  - HasTelemetryDb
                  - !Ref TelemetryDbSecretArn
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:claude-code-telemetry-db-unconfigured'

  # Security group for the quota monitor's VPC attachment. Egress only - the
  # function accepts no inbound traffic. Created only when a telemetry DB is
  # configured.
  QuotaMonitorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasTelemetryDb
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: >-
              The telemetry VPC has no interface/gateway VPC endpoints, so the
              DynamoDB, SNS and Secrets Manager API calls must reach public AWS
              endpoints via NAT. Restricting egress to prefix lists would break
              them.
          - id: W40
            reason: "Egress is restricted to explicit protocols/ports rather than IpProtocol: -1"
    Properties:
      GroupDescription: Egress-only security group for the Claude Code quota monitor Lambda
      VpcId: !Ref TelemetryDbVpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS API calls (DynamoDB, SNS, Secrets Manager) via NAT
        - IpProtocol: tcp
          FromPort: !Ref TelemetryDbPort
          ToPort: !Ref TelemetryDbPort
          CidrIp: !If
            - HasTelemetryDbEgressCidr
            - !Ref TelemetryDbEgressCidr
            - !Sub '${TelemetryDbHost}/32'
          Description: PostgreSQL/TimescaleDB
      Tags:
        - Key: Name
          Value: claude-code-quota-monitor-sg

  # Lambda function for quota monitoring
  QuotaMonitorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: >-
              VPC attachment is conditional (see the TelemetryDb* parameters).
              When a telemetry database is configured the function runs in the
              supplied private subnets; when it is not, the function only calls
              public AWS API endpoints and exposes no inbound surface.
          - id: W92
            reason: "Event-driven single invocation every 15 min — reserved concurrency unnecessary"
    Properties:
      FunctionName: claude-code-quota-monitor
      Description: Monitors user token usage and sends alerts when quotas are exceeded
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt QuotaMonitorRole.Arn
      # Headroom for cold ENI attach + NAT'd Secrets Manager + the DB query plus
      # a serial UpdateItem loop over every active identity.
      Timeout: 180
      MemorySize: 512
      VpcConfig: !If
        - HasTelemetryDb
        - SecurityGroupIds:
            - !GetAtt QuotaMonitorSecurityGroup.GroupId
          SubnetIds: !Ref TelemetryDbSubnetIds
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          QUOTA_TABLE: !Ref UserQuotaMetrics
          POLICIES_TABLE: !Ref QuotaPolicies
          SNS_TOPIC_ARN: !Ref QuotaAlertTopic
          MONTHLY_TOKEN_LIMIT: !Ref MonthlyTokenLimit
          WARNING_THRESHOLD_80: !Ref WarningThreshold80
          WARNING_THRESHOLD_90: !Ref WarningThreshold90
          DAILY_TOKEN_LIMIT: !Ref DailyTokenLimit
          DAILY_ENFORCEMENT_MODE: !Ref DailyEnforcementMode
          MONTHLY_ENFORCEMENT_MODE: !Ref MonthlyEnforcementMode
          ENABLE_FINEGRAINED_QUOTAS: !Ref EnableFinegrainedQuotas
          MONTHLY_COST_LIMIT_USD: !Ref MonthlyCostLimitUsd
          DAILY_COST_LIMIT_USD: !Ref DailyCostLimitUsd
          TELEMETRY_DB_HOST: !Ref TelemetryDbHost
          TELEMETRY_DB_PORT: !Ref TelemetryDbPort
          TELEMETRY_DB_NAME: !Ref TelemetryDbName
          TELEMETRY_DB_SECRET_ARN: !Ref TelemetryDbSecretArn
          TELEMETRY_DB_SSL_MODE: !Ref TelemetryDbSslMode
          TELEMETRY_DB_CA_PEM: !Ref TelemetryDbCaPem
          QUOTA_WRITE_MODE: !Ref QuotaWriteMode
          QUOTA_DB_MIN_ROW_RATIO: !Ref QuotaDbMinRowRatio
      Code: ./lambda-functions/quota_monitor/

  # EventBridge Rule to run quota monitor every 15 minutes
  QuotaMonitorScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: claude-code-quota-monitor-schedule
      Description: Trigger quota monitoring every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt QuotaMonitorFunction.Arn
          Id: QuotaMonitorTarget

  # Permission for EventBridge to invoke the Lambda
  QuotaMonitorSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QuotaMonitorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt QuotaMonitorScheduleRule.Arn

  # ============================================
  # Sidecar Bypass Detection (detective control)
  # Detects users invoking Bedrock without a running OTEL sidecar by joining
  # CloudTrail Bedrock activity (tamper-proof) against OTEL-reported usage.
  # ============================================

  # IAM Role for Bypass Detection Lambda
  SidecarMonitorRole:
    Type: AWS::IAM::Role
    Condition: BypassDetectionEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: BypassDetectionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Point reads on per-user records to check telemetry freshness
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt UserQuotaMetrics.Arn
              # Tamper-proof source of truth for who actually invoked Bedrock
              - Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: '*'
              # Publish per-user sidecar health metrics
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': 'ClaudeCode/SidecarHealth'
              # Alert administrators about stopped sidecars
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref QuotaAlertTopic

  # Lambda function for sidecar bypass detection
  SidecarMonitorFunction:
    Type: AWS::Lambda::Function
    Condition: BypassDetectionEnabled
    Properties:
      FunctionName: claude-code-bypass-detection
      Description: Detects users invoking Bedrock without a running OTEL sidecar (detective control)
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt SidecarMonitorRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          QUOTA_TABLE: !Ref UserQuotaMetrics
          SNS_TOPIC_ARN: !Ref QuotaAlertTopic
          METRICS_REGION: !Ref 'AWS::Region'
          LOOKBACK_MINUTES: !Ref BypassDetectionLookbackMinutes
          CLOUDWATCH_NAMESPACE: 'ClaudeCode/SidecarHealth'
      Code: ./lambda-functions/sidecar_monitor/

  # EventBridge Rule to run bypass detection every 15 minutes
  SidecarMonitorScheduleRule:
    Type: AWS::Events::Rule
    Condition: BypassDetectionEnabled
    Properties:
      Name: claude-code-bypass-detection-schedule
      Description: Trigger sidecar bypass detection every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SidecarMonitorFunction.Arn
          Id: BypassDetectionTarget

  # Permission for EventBridge to invoke the bypass detection Lambda
  SidecarMonitorSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: BypassDetectionEnabled
    Properties:
      FunctionName: !Ref SidecarMonitorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SidecarMonitorScheduleRule.Arn

  # ============================================
  # End Sidecar Bypass Detection
  # ============================================

  # ============================================
  # Quota Cost-Alert Slack Notifier
  # Subscribes to QuotaAlertTopic and DMs the affected user on Slack.
  # The subscription FilterPolicy limits invocations to monthly_cost/daily_cost
  # alerts, so token-quota alerts and operator alerts never reach this function
  # and there is no in-code alert-type check to keep in sync.
  # ============================================

  QuotaSlackNotifierRole:
    Type: AWS::IAM::Role
    Condition: SlackNotifierEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: QuotaSlackNotifierPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The only non-logging AWS call this function makes. No
              # placeholder-ARN !If is needed here (unlike QuotaMonitorRole
              # above): the whole role is conditional on the ARN being
              # non-empty, so Resource can never be an empty string.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SlackBotTokenSecretArn

  QuotaSlackNotifierFunction:
    Type: AWS::Lambda::Function
    Condition: SlackNotifierEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: >-
              Must reach slack.com. Attaching this to the telemetry VPC would
              require a NAT path to a public HTTPS endpoint and add a failure
              mode; the function exposes no inbound surface.
          - id: W92
            reason: >-
              Invoked only on spend-budget alerts, bounded by the quota_monitor
              dedup table to one per user/threshold/period, so reserved
              concurrency is unnecessary.
    Properties:
      FunctionName: claude-code-quota-slack-notifier
      Description: DMs the affected user on Slack when a Bedrock spend budget threshold is crossed
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt QuotaSlackNotifierRole.Arn
      # Two Slack calls, each with one bounded retry on a 429 Retry-After
      # (capped at 20s in code), plus a cold Secrets Manager fetch.
      Timeout: 60
      MemorySize: 256
      # Deliberately NOT VPC-attached — see the W89 suppression above.
      Environment:
        Variables:
          SLACK_BOT_TOKEN_SECRET_ARN: !Ref SlackBotTokenSecretArn
          SLACK_DM_ALLOWLIST: !Ref SlackDmAllowlist
          SLACK_API_TIMEOUT_SECONDS: !Ref SlackApiTimeoutSeconds
          SLACK_DM_HELP_URL: !Ref SlackDmHelpUrl
      Code: ./lambda-functions/quota_slack_notifier/

  QuotaSlackNotifierPermission:
    Type: AWS::Lambda::Permission
    Condition: SlackNotifierEnabled
    Properties:
      FunctionName: !Ref QuotaSlackNotifierFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref QuotaAlertTopic

  QuotaSlackNotifierSubscription:
    Type: AWS::SNS::Subscription
    Condition: SlackNotifierEnabled
    # A genuine ordering dependency, not an implicit Ref/GetAtt one: neither
    # resource references the other, but SNS accepts the subscription and then
    # fails delivery until the invoke permission exists.
    DependsOn: QuotaSlackNotifierPermission
    Properties:
      TopicArn: !Ref QuotaAlertTopic
      Protocol: lambda
      Endpoint: !GetAtt QuotaSlackNotifierFunction.Arn
      # Filters on message attributes (the default scope). A message that does
      # NOT carry an `alert_type` attribute is a NON-match, which is exactly how
      # operator alerts (_publish_operational_alert) and sidecar bypass alerts
      # are excluded — they publish no attributes at all. Token-quota alerts
      # carry alert_type "monthly"/"daily" and so also do not match.
      FilterPolicy:
        alert_type:
          - monthly_cost
          - daily_cost

  # ============================================
  # End Quota Cost-Alert Slack Notifier
  # ============================================

  # ============================================
  # Quota Check API (Phase 2 - Access Blocking)
  # ============================================

  # IAM Role for Quota Check Lambda
  QuotaCheckRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: QuotaCheckPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt UserQuotaMetrics.Arn
                  - !GetAtt QuotaPolicies.Arn
                  - !Sub '${QuotaPolicies.Arn}/index/*'

  # Lambda function for real-time quota checking
  QuotaCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: claude-code-quota-check
      Description: Real-time quota check for credential issuance - blocks access when quota exceeded
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt QuotaCheckRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          QUOTA_TABLE: !Ref UserQuotaMetrics
          POLICIES_TABLE: !Ref QuotaPolicies
          MONTHLY_TOKEN_LIMIT: !Ref MonthlyTokenLimit
          DAILY_TOKEN_LIMIT: !Ref DailyTokenLimit
          MONTHLY_COST_LIMIT_USD: !Ref MonthlyCostLimitUsd
          DAILY_COST_LIMIT_USD: !Ref DailyCostLimitUsd
          DAILY_ENFORCEMENT_MODE: !Ref DailyEnforcementMode
          MONTHLY_ENFORCEMENT_MODE: !Ref MonthlyEnforcementMode
          ENABLE_FINEGRAINED_QUOTAS: !Ref EnableFinegrainedQuotas
      Code: ./lambda-functions/quota_check/

  # HTTP API Gateway (v2 - cheaper and faster than REST API)
  QuotaCheckApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-quota-check-api'
      Description: Real-time quota check API for Claude Code credential provider (JWT authenticated)
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # JWT Authorizer for OIDC token validation (only when SSO is enabled)
  QuotaCheckAuthorizer:
    Condition: HasJwtAuth
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref QuotaCheckApi
      AuthorizerType: JWT
      Name: oidc-jwt-authorizer
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Ref OidcIssuerUrl
        Audience:
          - !Ref OidcClientId

  # Lambda integration for API Gateway
  QuotaCheckIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref QuotaCheckApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt QuotaCheckFunction.Arn
      PayloadFormatVersion: '2.0'

  # Route for GET /check — single resource to avoid route-key conflict on
  # in-place updates (two resources sharing the same RouteKey causes CFN 409).
  # Uses !If to switch between JWT auth (OIDC) and IAM auth (IDC/none).
  QuotaCheckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref QuotaCheckApi
      RouteKey: 'GET /check'
      Target: !Sub 'integrations/${QuotaCheckIntegration}'
      AuthorizerId: !If [HasJwtAuth, !Ref QuotaCheckAuthorizer, !Ref 'AWS::NoValue']
      AuthorizationType: !If [HasJwtAuth, 'JWT', 'AWS_IAM']

  # Default stage with auto-deploy
  QuotaCheckStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref QuotaCheckApi
      StageName: '$default'
      AutoDeploy: true

  # Permission for API Gateway to invoke Lambda
  QuotaCheckLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QuotaCheckFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${QuotaCheckApi}/*'

  # ============================================
  # End Quota Check API
  # ============================================

  # IAM Managed Policy granting execute-api:Invoke on the quota API.
  # Required for IAM-auth callers (IDC permission sets, federated roles).
  # The credential-process signs requests with SigV4, and API Gateway
  # requires the caller to have this permission in their identity policy.
  # Admins should attach this policy to their IDC permission set or IAM role.
  QuotaApiInvokePolicy:
    Condition: NoJwtAuth
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-QuotaApiInvoke'
      Description: 'Allows invoke on the quota check API Gateway (required for IAM-auth callers)'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowQuotaApiInvoke
            Effect: Allow
            Action: 'execute-api:Invoke'
            Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${QuotaCheckApi}/*'

Outputs:
  QuotaTableName:
    Description: Name of the UserQuotaMetrics DynamoDB table
    Value: !Ref UserQuotaMetrics
    Export:
      Name: !Sub '${AWS::StackName}-QuotaTableName'

  QuotaTableArn:
    Description: ARN of the UserQuotaMetrics DynamoDB table
    Value: !GetAtt UserQuotaMetrics.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QuotaTableArn'

  PoliciesTableName:
    Description: Name of the QuotaPolicies DynamoDB table for fine-grained quotas
    Value: !Ref QuotaPolicies
    Export:
      Name: !Sub '${AWS::StackName}-PoliciesTableName'

  PoliciesTableArn:
    Description: ARN of the QuotaPolicies DynamoDB table
    Value: !GetAtt QuotaPolicies.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PoliciesTableArn'

  QuotaAlertTopicArn:
    Description: SNS Topic ARN for quota alerts - subscribe to this for notifications
    Value: !Ref QuotaAlertTopic
    Export:
      Name: !Sub '${AWS::StackName}-QuotaAlertTopicArn'

  QuotaMonitorFunctionArn:
    Description: ARN of the quota monitoring Lambda function
    Value: !GetAtt QuotaMonitorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QuotaMonitorFunctionArn'

  QuotaCheckApiEndpoint:
    Description: HTTP API endpoint for real-time quota checks - configure in credential provider
    Value: !Sub 'https://${QuotaCheckApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-QuotaCheckApiEndpoint'

  QuotaCheckFunctionArn:
    Description: ARN of the quota check Lambda function
    Value: !GetAtt QuotaCheckFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QuotaCheckFunctionArn'

  SidecarMonitorFunctionArn:
    Condition: BypassDetectionEnabled
    Description: ARN of the sidecar bypass-detection Lambda function
    Value: !GetAtt SidecarMonitorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SidecarMonitorFunctionArn'

  QuotaSlackNotifierFunctionArn:
    Condition: SlackNotifierEnabled
    Description: ARN of the Lambda that DMs users on Slack for spend-budget alerts
    Value: !GetAtt QuotaSlackNotifierFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QuotaSlackNotifierFunctionArn'

  QuotaApiInvokePolicyArn:
    Condition: NoJwtAuth
    Description: >-
      IAM Managed Policy ARN granting execute-api:Invoke on the quota API.
      Attach this to your IDC permission set or IAM role used by Claude Code users.
    Value: !Ref QuotaApiInvokePolicy
    Export:
      Name: !Sub '${AWS::StackName}-QuotaApiInvokePolicyArn'
